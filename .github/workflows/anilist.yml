name: Generar Metricas de AniList
on:
  # Ejecutar automáticamente todos los días
  schedule: [{cron: "0 0 * * *"}]
  # Ejecutar cuando se haga un cambio en el código
  push: {branches: ["master", "main"]}
  # Permitir ejecutarlo manualmente desde GitHub
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Instalar Python y dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar script de AniList
        run: python scripts/generate_anilist_card.py

      - name: Subir la nueva imagen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/anilist_custom.svg
          git commit -m "Actualizar tarjeta personalizada de AniList" || echo "No changes to commit"
          git push
